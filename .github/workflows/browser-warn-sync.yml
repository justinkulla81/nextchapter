# Daily import of the WARN sources that need a real browser.
#
# This runs here rather than on the Vercel cron because a serverless function
# has no browser. Two things need one: the layoffs.fyi tracker, which serves
# its data only to its own rendered embed, and the states that either build
# their list client-side or refuse scripted requests (mass.gov returns 403 to
# everything that is not a browser). Every other state still syncs on Vercel.
#
# A third kind needs neither a browser nor our own parser: twenty states whose
# lists are PDFs, dashboards or search forms are read by Big Local News's
# open-source warn-scraper and standardized by warn-transformer (both Apache
# 2.0, Stanford), then posted to /api/admin/warn/import-rows.
name: Browser WARN sync

on:
  schedule:
    # Daily at 08:00 UTC, an hour after the state WARN sync, so the two do
    # not compete for the same rows. (Weekly until October 2026; the public
    # layoff tracker made a week-old Texas or layoffs.fyi feed too stale.)
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Import layoffs.fyi
        env:
          NEXTCHAPTER_URL: ${{ secrets.NEXTCHAPTER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npx tsx scripts/layoffsfyi/fetch.ts

      - name: Import browser-only states
        # Runs even if the tracker failed; the two are independent sources.
        if: always()
        env:
          NEXTCHAPTER_URL: ${{ secrets.NEXTCHAPTER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npx tsx scripts/warn/render-states.ts

      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.12'

      - name: Install the WARN scrapers
        if: always()
        # From the repository rather than the last release: it carries scrapers
        # (North Dakota) and fixes the release does not. pyquery, lxml and
        # html5lib are used by some state scrapers but not declared by the package.
        # Its setup.py runs `import warn`, so building it needs jinja2 and us, the
        # scraper's own runtime libraries, and its folder on the import path; that
        # is why it is cloned and built here rather than installed from a git URL
        # (which failed every run and silently fell back to the old release).
        # If the repository build still fails, the last release is installed so
        # the other states run. Both packages are pinned to versions that ran
        # clean (warn-scraper at f937fea, 2026-10-08; warn-transformer 1.3.413)
        # so an upstream push cannot break the daily run; bump them deliberately.
        # Network installs retry up to three times for transient failures.
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed: $*"; sleep $((i * 15)); done; return 1; }
          retry pip install --quiet jinja2 us pyquery lxml html5lib warn-transformer==1.3.413
          install_from_repo() {
            retry pip install --quiet "setuptools>=80" "setuptools-scm[toml]>=10" wheel \
              bln click beautifulsoup4 pdfplumber requests openpyxl pyopenssl retry2 selenium stealthenium tenacity xlrd xvfbwrapper webdriver-manager
            rm -rf /tmp/warn-scraper
            retry git clone --quiet https://github.com/biglocalnews/warn-scraper.git /tmp/warn-scraper
            git -C /tmp/warn-scraper checkout --quiet f937fea034adf6401f443ec8c5213859c946f279
            (cd /tmp/warn-scraper && PYTHONPATH="$PWD" SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0 \
              pip install --quiet --no-build-isolation --no-deps .)
          }
          install_from_repo || retry pip install --quiet warn-scraper
          warn-scraper --help > /dev/null

      - name: Import scraped states
        # Each state imports on its own; one state's broken site fails only that state.
        if: always()
        env:
          NEXTCHAPTER_URL: ${{ secrets.NEXTCHAPTER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python scripts/warn/scraped_states.py
