name: CI

# Typecheck, unit tests and lint on every PR and push to main. `next build` is
# deliberately not run here: static generation needs a live DATABASE_URL, and
# Vercel's own build already covers it. The lint step skips one test file that
# predates this workflow and has known `no-explicit-any` errors; remove the
# ignore once those are fixed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      # postinstall runs `prisma generate`, which the typecheck needs.
      - run: npm ci
      # Shipped (non-dev) dependencies must have no high/critical advisories
      # (CASA 6.1.1). Dev-only tooling (eslint, shadcn CLI) is not deployed.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit -p .
        env:
          # The type-check ran out of memory (exit 134) as the codebase grew; the runner has 7 GB.
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npx vitest run
      - run: npx eslint src --ignore-pattern src/test/token-crypto-extension.test.ts
